spring.application.name=movie-ticket-booking-backend-test

# Isolated separate test database configuration (prevents connecting to the operational database)
spring.datasource.url=${SPRING_TEST_DATASOURCE_URL:jdbc:mysql://localhost:3307/movie_ticket_booking_test?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_TEST_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${SPRING_TEST_DB_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:}
